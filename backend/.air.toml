root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql", "tmpl", "toml"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  # Migrations are embedded and run at boot, so a .sql change must rebuild.
  include_dir = ["cmd", "internal", "migrations"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  # riverClient.Stop drains an in-flight job before the process exits — a
  # summarise call averages ~10s (ticket 16), so this has to outlast one,
  # not just the LLM call itself but also the shutdown sequence ahead of
  # it (srv.Shutdown, then Stop, each with their own timeout in main.go).
  kill_delay = "20s"

[log]
  time = true

[misc]
  clean_on_exit = true
